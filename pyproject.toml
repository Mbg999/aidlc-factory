[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aidlc-factory-installer"
version = "0.3.5"
description = "AIDLC Factory — multi-agent software development orchestrator (installer bootstrap)"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Mbg999"},
]
license = {text = "Apache-2.0"}
homepage = "https://github.com/Mbg999/aidlc-factory"
keywords = ["aidlc", "ai-dlc", "orchestrator", "multi-agent", "software-factory"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
    "Topic :: Software Development :: Code Generators",
]

[project.urls]
Homepage = "https://github.com/Mbg999/aidlc-factory"
Source = "https://github.com/Mbg999/aidlc-factory"
Tracker = "https://github.com/Mbg999/aidlc-factory/issues"

[project.scripts]
aidlc-factory-installer = "aidlc_factory_installer:main"

[tool.hatch.build.targets.wheel]
include = [
    "aidlc-scripts/**",
    "aidlc_factory_installer/**",
    ".aidlc-orchestrator/contracts/**",
    ".aidlc-orchestrator/runtime/**",
    ".aidlc-orchestrator/prompts/**",
    ".aidlc-orchestrator/budgets/default.yaml",
    ".claude/agents/**",
    ".claude/commands/**",
    ".cursor/agents/**",
    ".cursor/commands/**",
    ".cursor/mcp.json",
    ".github/agents/**",
    ".github/prompts/**",
    ".github/instructions/**",
    ".github/copilot-*.md",
    ".opencode/agents/**",
    ".opencode/commands/**",
    ".codex/agents/**",
    ".codex/config.toml",
    ".frida/skills/**",
    ".agents/custom-skills/**",
    ".mcp.json",
    "opencode.json",
    ".vscode/mcp.json",
    "skill-sources.yaml",
]