# DRAFT: Cookbook Integration CI (opt-in)
#
# This is a PROPOSED ADDITION — not yet active (file extension is .draft.yml).
# It extends the existing CI with a dedicated Architecture Cookbook test job
# that runs on a cross-platform matrix (Ubuntu, Windows, macOS).
#
# To activate: rename to cookbook-ci.yml and review permissions.
#
# Why this is useful:
# - The existing `pytest tests/` in ci.yml already runs cookbook tests on Ubuntu
# - This job adds explicit visibility into cookbook test results
# - Cross-platform matrix validates Windows/macOS encoding and path fixes
# - Separate from the main test suite for faster CI feedback

name: Cookbook CI (Draft)

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'aidlc-factory/aidlc-scripts/install_aidlc.py'
      - 'aidlc-factory/aidlc-scripts/factory_validate.py'
      - 'aidlc-factory/tests/test_cookbook_e2e.py'
      - 'aidlc-factory/.github/workflows/*.yml'
  push:
    branches: [ "main" ]
    paths:
      - 'aidlc-factory/aidlc-scripts/install_aidlc.py'
      - 'aidlc-factory/tests/test_cookbook_e2e.py'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cookbook-tests:
    name: Cookbook Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install pyyaml jsonschema pytest

      - name: Run cookbook unit tests only
        run: pytest tests/test_cookbook_e2e.py -v --tb=short

      - name: Validate cookbook schema contracts
        run: python aidlc-scripts/factory_validate.py .aidlc-orchestrator/contracts/ship-agent.output.v1.json .aidlc-orchestrator/runs/*/handoffs/ship-agent.output.yaml --check-cookbook 2>/dev/null || echo "No cookbook output to validate (expected on first run)"
